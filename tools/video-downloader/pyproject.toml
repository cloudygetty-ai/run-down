[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdl"
version = "1.0.0"
description = "Hardened CLI video/audio downloader built on yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
# Ships a static ffmpeg binary so merging and audio extraction work without a
# system-wide install.
ffmpeg = ["imageio-ffmpeg>=0.4.9"]
dev = ["pytest>=7.4"]

[project.scripts]
vdl = "vdl.cli:main"

[tool.setuptools]
packages = ["vdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
