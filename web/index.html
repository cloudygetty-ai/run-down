<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CRUISE — Cruising Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --obsidian:    #0D0A14;
      --obsidian-2:  #13101C;
      --obsidian-3:  #1A1528;
      --obsidian-4:  #221D34;
      --obsidian:    #09080F;
      --obsidian-2:  #120F1E;
      --obsidian-3:  #1C1730;
      --obsidian-4:  #28204A;
      --gold:        #C9A84C;
      --gold-dim:    #7A6228;
      --gold-bright: #F0C96A;
      --violet:      #8B5CF6;
      --violet-dim:  #4C2A9C;
      --teal:        #4ECDC4;
      --cream:       #F5F0E8;
      --muted:       #6B5E8A;
      --muted-2:     #3D2A6E;
      --danger:      #E85555;
      --border:      rgba(139,92,246,0.12);
      --font-display: 'Cinzel', serif;
      --font-ui:      'DM Mono', monospace;
    }
    html, body, #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--obsidian);
    }
    body {
      font-family: var(--font-ui);
      color: var(--cream);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted-2); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
